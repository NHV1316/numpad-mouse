name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with the .NET Framework C# compiler
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:NumpadMouse.exe NumpadMouse.cs

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path NumpadMouse.exe, NumpadMouse.cs, build.bat, README.md -DestinationPath NumpadMouse.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NumpadMouse
          path: NumpadMouse.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NumpadMouse.zip
            NumpadMouse.exe
